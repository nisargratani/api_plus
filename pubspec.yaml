name: api_plus
description: "An enterprise-grade, adapter-based Dart networking package with robust retry, caching, and logging systems supporting Dio, Http, and Retrofit."
version: 0.0.1
homepage: https://github.com/your-username/api_plus

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  http: ^1.2.0
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  retrofit_generator: ^8.0.0
  build_runner: ^2.4.0
  retrofit: ^4.0.0
  mocktail: ^1.0.0
