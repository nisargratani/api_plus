name: api_plus
description: >-
  Adapter-based Dart networking with shared retry, HTTP caching (ETag,
  stale-while-revalidate), and logging interceptors for Dio, http, and Retrofit.
version: 0.0.3
homepage: https://github.com/nisargratani/api_plus
repository: https://github.com/nisargratani/api_plus
issue_tracker: https://github.com/nisargratani/api_plus/issues
topics:
  - http
  - networking
  - retry
  - cache
  - logging

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  dio: ^5.11.0
  http: ^1.6.0
  meta: ^1.11.0

dev_dependencies:
  lints: ">=4.0.0 <7.0.0"
  test: ^1.25.0
