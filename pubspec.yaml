name: api_plus
description: >-
  An enterprise-grade, adapter-based Dart networking package with robust retry,
  caching, and logging systems supporting Dio, Http, and Retrofit.
version: 0.0.2
homepage: https://github.com/nisargratani/api_plus
repository: https://github.com/nisargratani/api_plus
issue_tracker: https://github.com/nisargratani/api_plus/issues
topics:
  - http
  - networking
  - retry
  - cache
  - logging

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  dio: ^5.11.0
  http: ^1.6.0
  meta: ^1.11.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
  mocktail: ^1.0.5
  fake_async: ^1.3.2
